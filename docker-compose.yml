services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=echo
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=echo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data: